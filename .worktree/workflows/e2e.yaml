name: E2E

# The Playwright suite, on merges to `main` only. Deliberately never on a pull
# request.
#
# It used to be a required check on every pull request, and it was removed
# because this host stalls. Four times in about twenty-four hours a job went
# silent mid-run and was reaped roughly fifteen minutes later: once before any
# test ran, twice mid-suite, once at test 258 of 293. The stalls track nothing
# in the code — two of them were on pull requests that changed only Markdown.
#
# There is no way to make that failure quick or legible from inside the
# repository. `timeout-minutes:` is rejected by this runner outright. A shell
# `timeout` around the command does not fire either, and neither does
# Playwright's own `globalTimeout` or its `webServer.timeout` — the whole
# container freezes, so nothing scheduled inside it runs. There is also no
# Actions API here, so a job cannot be re-run except by hand in the web UI.
#
# A required check that fails at random, for reasons unrelated to the change,
# cannot be re-run from a script, and takes seventeen minutes to say nothing —
# that is not a gate. It teaches people that red means "press the button again",
# which is exactly the habit that lets a real failure through.
#
# So the suite runs here instead, where it is a signal rather than a gate: a red
# run on `main` says look at this, and blocks nobody. The trade is real and worth
# naming — a browser-visible regression can now reach `main` before anything
# catches it. `npm run verify:all` before merging rendering changes is what
# covers that gap, and it is on the person merging.

on:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Every Playwright project in playwright.config.ts is Chromium-backed — the
      # mobile ones are Chromium device emulation — so this is the only browser needed.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
