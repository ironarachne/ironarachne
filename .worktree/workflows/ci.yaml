name: CI

# Workflows live in `.worktree/workflows` on Worktree.ca — not `.github` or `.forgejo`,
# neither of which this host reads. Actions in the `actions/` namespace resolve bare;
# anything else needs its full URL (`uses: https://github.com/owner/repo@vX`).
#
# This is the gate on a pull request, and it is the only one: types, lint, unit
# tests, coverage. It is required by `main`'s branch protection as the context
# "CI / verify (pull_request)".
#
# The browser suite is not here. It lives in `e2e.yaml` and runs only on merges
# to `main` — see that file for why. Anything touching routes, components, or
# rendering wants `npm run verify:all` locally before it is merged, because
# nothing will run Playwright against the pull request.
#
# Note that `verify` runs on documentation-only changes too. `npm run lint`
# calls `prettier --check .`, which covers Markdown, so this is the check that
# stops a badly formatted document landing and breaking `lint` on `main`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run verify
