name: Deploy

# Manual promotion of a released version to staging or prod.
#
# Nothing is built here. The artifact comes from the release that build.yaml
# attached it to, so what reaches prod is the exact bytes that were tested —
# not a rebuild that happens to come from the same commit.
#
# Only released versions can be promoted, because only they have an artifact.
# Cut one by bumping package.json; see docs/versioning.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        options:
          - staging
          - prod
      version:
        description: Released version to deploy, e.g. 2.3.2
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reading the dispatch inputs is genuinely awkward on this host, and two
      # earlier prod deploys failed on it:
      #
      #   - `${{ inputs.x }}` evaluated to an empty string, so the scripts ran
      #     with no arguments;
      #   - `${{ github.event.inputs.x }}` in a *job-level* `env:` block was not
      #     evaluated at all and arrived as literal `${{ … }}` text.
      #
      # Step-level `env:` is evaluated — build.yaml depends on it — so both
      # spellings are read here, whichever one this host actually populates is
      # used, and anything still looking like an unevaluated expression is
      # discarded. The values then travel on as step outputs, which work.
      - name: Resolve the dispatch inputs
        id: resolve
        env:
          EVENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          EVENT_VERSION: ${{ github.event.inputs.version }}
          CONTEXT_ENVIRONMENT: ${{ inputs.environment }}
          CONTEXT_VERSION: ${{ inputs.version }}
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        run: |
          # A host that does not evaluate an expression leaves it verbatim.
          # Treat that as "not supplied" rather than as a value.
          usable() {
            case "$1" in
              *'${{'*) printf '' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          event_environment="$(usable "$EVENT_ENVIRONMENT")"
          event_version="$(usable "$EVENT_VERSION")"
          context_environment="$(usable "$CONTEXT_ENVIRONMENT")"
          context_version="$(usable "$CONTEXT_VERSION")"

          echo "github.event.inputs.environment -> '$event_environment'"
          echo "github.event.inputs.version     -> '$event_version'"
          echo "inputs.environment              -> '$context_environment'"
          echo "inputs.version                  -> '$context_version'"

          environment="${event_environment:-$context_environment}"
          version="${event_version:-$context_version}"

          if [ -z "$environment" ] || [ -z "$version" ]; then
            echo "::error::The dispatch inputs did not reach the workflow (environment='$environment' version='$version'). Nothing has been deployed."
            echo "--- github.event payload, for working out where the inputs went ---"
            echo "$EVENT_PAYLOAD"
            exit 1
          fi

          case "$environment" in
            staging | prod) ;;
            *)
              echo "::error::Refusing to deploy to unknown environment '$environment'."
              exit 1
              ;;
          esac

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $version to $environment"

      - name: Fetch the released artifact
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: ./scripts/fetch_release_artifact.sh "$VERSION" build

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Publish
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: ./scripts/publish_site.sh "$ENVIRONMENT" build

      - name: Summarise
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          case "$ENVIRONMENT" in
            staging) url="https://staging.ironarachne.com" ;;
            prod) url="https://app.ironarachne.com" ;;
          esac
          echo "Deployed $VERSION to $ENVIRONMENT — $url"
