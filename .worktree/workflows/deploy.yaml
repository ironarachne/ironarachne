name: Deploy

# Manual promotion of a released version to staging or prod.
#
# Nothing is built here. The artifact comes from the release that build.yaml
# attached it to, so what reaches prod is the exact bytes that were tested —
# not a rebuild that happens to come from the same commit.
#
# Only released versions can be promoted, because only they have an artifact.
# Cut one by bumping package.json; see docs/versioning.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        options:
          - staging
          - prod
      version:
        description: Released version to deploy, e.g. 2.3.0
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Read through `github.event.inputs`, not the `inputs` context. This host
    # does not populate `inputs`, so `${{ inputs.version }}` expands to an empty
    # string and the scripts are called with no arguments — which is how the
    # first manual prod deploy failed, with a bare `usage:` line and no clue why.
    # `github.event.inputs` works on both this host and GitHub.
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Fail with a sentence rather than a usage line if an input is ever empty
      # again, whatever the reason.
      - name: Check the inputs arrived
        run: |
          missing=""
          [ -n "$ENVIRONMENT" ] || missing="environment"
          [ -n "$VERSION" ] || missing="${missing:+$missing and }version"

          if [ -n "$missing" ]; then
            echo "::error::The $missing input reached the workflow empty. Nothing has been deployed."
            exit 1
          fi

          echo "Deploying $VERSION to $ENVIRONMENT"

      - name: Fetch the released artifact
        run: ./scripts/fetch_release_artifact.sh "$VERSION" build

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Publish
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: ./scripts/publish_site.sh "$ENVIRONMENT" build

      - name: Summarise
        run: |
          case "$ENVIRONMENT" in
            staging) url="https://staging.ironarachne.com" ;;
            prod) url="https://app.ironarachne.com" ;;
          esac
          echo "Deployed $VERSION to $ENVIRONMENT — $url"
