name: Deploy

# Manual promotion of a released version to staging or prod.
#
# Nothing is built here. The artifact comes from the release that build.yaml
# attached it to, so what reaches prod is the exact bytes that were tested —
# not a rebuild that happens to come from the same commit.
#
# Only released versions can be promoted, because only they have an artifact.
# Cut one by bumping package.json; see docs/versioning.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        required: true
        options:
          - staging
          - prod
      version:
        description: Released version to deploy, e.g. 2.3.2
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reading the dispatch inputs is genuinely awkward on this host, and two
      # earlier prod deploys failed on it:
      #
      #   - `${{ inputs.x }}` evaluated to an empty string, so the scripts ran
      #     with no arguments;
      #   - `${{ github.event.inputs.x }}` in a *job-level* `env:` block was not
      #     evaluated at all and arrived as literal `${{ … }}` text.
      #
      # Step-level `env:` is evaluated — build.yaml depends on it — so both
      # spellings are read here, whichever one this host actually populates is
      # used, and anything still looking like an unevaluated expression is
      # discarded. The values then travel on as step outputs, which work.
      - name: Resolve the dispatch inputs
        id: resolve
        env:
          EVENT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          EVENT_VERSION: ${{ github.event.inputs.version }}
          CONTEXT_ENVIRONMENT: ${{ inputs.environment }}
          CONTEXT_VERSION: ${{ inputs.version }}
        run: |
          # Everything is printed before anything is judged. A previous version
          # validated first and exited on a bad value, which suppressed the very
          # dump that would have explained it.
          echo "--- expression contexts ---"
          echo "github.event.inputs.environment -> '$EVENT_ENVIRONMENT'"
          echo "github.event.inputs.version     -> '$EVENT_VERSION'"
          echo "inputs.environment              -> '$CONTEXT_ENVIRONMENT'"
          echo "inputs.version                  -> '$CONTEXT_VERSION'"

          echo "--- event payload at \$GITHUB_EVENT_PATH ($GITHUB_EVENT_PATH) ---"
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            cat "$GITHUB_EVENT_PATH"
            echo
          else
            echo "(no event payload file)"
          fi

          echo "--- environment variables mentioning INPUT ---"
          env | grep -i input || echo "(none)"

          echo "--- tools ---"
          for tool in jq curl tar sha256sum; do
            printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

          # A value is only usable if the host actually substituted something.
          # Two known non-values: an unevaluated `${{ … }}`, and `map[]`, which
          # is how an empty map renders when the key does not exist.
          usable() {
            case "$1" in
              '' | 'map[]' | *'${{'*) printf '' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          environment="$(usable "$EVENT_ENVIRONMENT")"
          [ -n "$environment" ] || environment="$(usable "$CONTEXT_ENVIRONMENT")"
          version="$(usable "$EVENT_VERSION")"
          [ -n "$version" ] || version="$(usable "$CONTEXT_VERSION")"

          # Last resort: read them straight out of the event payload, bypassing
          # the expression engine entirely.
          if [ -z "$environment" ] && [ -f "${GITHUB_EVENT_PATH:-}" ] && command -v jq >/dev/null 2>&1; then
            environment="$(jq -r '.inputs.environment // empty' "$GITHUB_EVENT_PATH")"
          fi
          if [ -z "$version" ] && [ -f "${GITHUB_EVENT_PATH:-}" ] && command -v jq >/dev/null 2>&1; then
            version="$(jq -r '.inputs.version // empty' "$GITHUB_EVENT_PATH")"
          fi

          echo "--- resolved ---"
          echo "environment='$environment' version='$version'"

          if [ -z "$environment" ] || [ -z "$version" ]; then
            echo "::error::The dispatch inputs did not reach this workflow by any route. Nothing has been deployed. See the dumps above; docs/deployment.md records what has been tried."
            exit 1
          fi

          case "$environment" in
            staging | prod) ;;
            *)
              echo "::error::Refusing to deploy to unknown environment '$environment'."
              exit 1
              ;;
          esac

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Deploying $version to $environment"

      - name: Fetch the released artifact
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: ./scripts/fetch_release_artifact.sh "$VERSION" build

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Publish
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: ./scripts/publish_site.sh "$ENVIRONMENT" build

      - name: Summarise
        env:
          ENVIRONMENT: ${{ steps.resolve.outputs.environment }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          case "$ENVIRONMENT" in
            staging) url="https://staging.ironarachne.com" ;;
            prod) url="https://app.ironarachne.com" ;;
          esac
          echo "Deployed $VERSION to $ENVIRONMENT — $url"
