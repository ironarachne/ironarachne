name: Golden baselines

# Generates the astronomical preview baselines that `e2e/preview_goldens.spec.ts` compares against,
# and pushes them to a branch for a human to review and merge.
#
# It runs only when someone asks for it. Baselines are not something a schedule should decide to
# replace, and a workflow that regenerated them automatically would turn every regression into a new
# baseline — which is the failure mode this whole tier exists to avoid.
#
# Why here rather than on a developer machine: CI rasterizes WebGL on the CPU through SwiftShader.
# A machine with a GPU draws the same scene with different floating point, and a baseline captured
# on one will not match the other at any tolerance loose enough to still catch a black frame. The
# spec refuses to write baselines unless asked precisely because of that.
#
# Why a branch rather than an artifact: **workflow artifacts do not work on this host, at any
# version.** The runner never sets `ACTIONS_RUNTIME_TOKEN`, so the artifact service cannot
# authenticate; `docs/deployment.md`, "Actions on this host", records the three runs that
# established it and says in as many words not to add `upload-artifact` back in any form. Anything
# that has to outlive the job goes somewhere real. A branch is the most real thing available here,
# and it is also the shape the output wants to be: a commit containing the baselines.
#
# The loop, which is written up in `src/lib/renderers/README.md`:
#
#   1. Dispatch this workflow on the branch whose rendering you want to bless.
#   2. It pushes `goldens/<short sha>` and prints the name.
#   3. Open a pull request from that branch and **look at the images**. They are the baseline:
#      anything wrong in them is a regression this tier will then defend.
#   4. Merge. The goldens start asserting on the next run of the E2E workflow.

on:
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # `all` rather than a bare `--update-snapshots`, which means `changed` and would leave a
      # baseline in place if it merely differed. This job's whole purpose is to produce the current
      # output of this commit, so it writes every one.
      - name: Render the baselines
        run: npx playwright test --project=chromium preview_goldens --update-snapshots=all

      - name: Push them to a branch
        env:
          WORKTREE_TOKEN: ${{ secrets.WORKTREE_ACCESS_TOKEN }}
        run: |
          set -eu

          snapshots="e2e/preview_goldens.spec.ts-snapshots"
          echo "Baselines rendered by this run:"
          ls -l "$snapshots"

          if git diff --quiet -- "$snapshots" && [ -z "$(git status --porcelain -- "$snapshots")" ]; then
            echo "::notice::The committed baselines already match this run. Nothing to push."
            exit 0
          fi

          if [ -z "$WORKTREE_TOKEN" ]; then
            echo "::error::WORKTREE_ACCESS_TOKEN is unset, so the baselines cannot be pushed. They exist only in this job's workspace and will be discarded."
            exit 1
          fi

          # `git rev-parse` rather than $GITHUB_SHA: most of the GITHUB_* context is empty on this
          # host, and the working tree is always right in front of us.
          branch="goldens/$(git rev-parse --short HEAD)"

          git config user.name "Worktree Actions"
          git config user.email "actions@worktree.ca"
          git add "$snapshots"
          git commit -m "Golden baselines rendered by CI at $(git rev-parse --short HEAD)"

          # Force, so dispatching twice on the same commit means "do it again" rather than failing
          # on a branch that already exists. It only ever touches a goldens/ branch.
          git push --force \
            "https://oauth2:$WORKTREE_TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" \
            "HEAD:refs/heads/$branch"

          echo "::notice::Baselines pushed to $branch. Open a pull request from it, look at the images, and merge."
