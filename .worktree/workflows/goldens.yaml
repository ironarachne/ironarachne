name: Golden baselines

# Generates the astronomical preview baselines that `e2e/preview_goldens.spec.ts` compares
# against, and uploads them for a human to commit.
#
# It runs only when someone asks for it. Baselines are not something a schedule should decide to
# replace, and a workflow that regenerated them automatically would turn every regression into a
# new baseline — which is the failure mode this whole tier exists to avoid.
#
# Why here rather than on a developer machine: CI rasterizes WebGL on the CPU through SwiftShader.
# A machine with a GPU draws the same scene with different floating point, and a baseline captured
# on one will not match the other at any tolerance loose enough to still catch a black frame. The
# spec refuses to write baselines unless asked precisely because of that.
#
# The loop, which is written up in `src/lib/renderers/README.md`:
#
#   1. Dispatch this workflow (on `main`, or on the branch that changed the rendering).
#   2. Download the `preview-goldens` artifact.
#   3. Unpack it over `e2e/preview_goldens.spec.ts-snapshots/` and **look at the images**. They are
#      the baseline: anything wrong in them is a regression this tier will then defend.
#   4. Commit them, and the goldens start asserting on the next run of the E2E workflow.
#
# If this host turns out not to keep artifacts, the fallback is to have this job push the snapshots
# to a branch with `secrets.WORKTREE_ACCESS_TOKEN` — the same token `build.yaml` uses for releases —
# and open a pull request from it. The generation step is identical either way.

on:
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # `all` rather than a bare `--update-snapshots`, which means `changed` and would leave a
      # baseline in place if it merely differed. This job's whole purpose is to produce the current
      # output of this commit, so it writes every one.
      - name: Render the baselines
        run: npx playwright test --project=chromium preview_goldens --update-snapshots=all

      - name: Report what was produced
        run: |
          echo "Baselines rendered by this run:"
          ls -l e2e/preview_goldens.spec.ts-snapshots/
          echo
          echo "WebGL renderer this job used, for the record:"
          node -e "console.log(process.report?.getReport()?.header?.cpus?.[0]?.model ?? 'unknown cpu')"

      - uses: actions/upload-artifact@v4
        with:
          name: preview-goldens
          path: e2e/preview_goldens.spec.ts-snapshots/
          if-no-files-found: error
