name: Build

# Runs on every merge to main: cuts a tag when package.json's version is new,
# produces a versioned artifact, publishes it as a release asset, and deploys it
# to dev. See docs/deployment.md and docs/versioning.md.
#
# One job, not two, because this host provides no ACTIONS_RUNTIME_TOKEN and so
# implements no workflow artifacts — there is no way to hand a file from one job
# to another. The build/deploy separation therefore lives in the scripts and in
# deploy.yaml rather than in job boundaries. To keep the hand-off honest anyway,
# the deploy step publishes the *unpacked artifact* rather than the build output
# directly, so dev serves exactly the bytes the release contains.
#
# Deliberately no `workflow_dispatch` here. Running on push is this workflow's
# entire purpose, and a manual run would either re-tag or rebuild a commit that
# already has an artifact. Manual deploys live in deploy.yaml, which promotes an
# existing artifact rather than making a new one.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/site_version.sh derives the version with `git describe`, so
          # it needs the full history and every tag. A shallow clone would find
          # no tag and quietly produce a misleading version.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Tagging happens before the version is read, so a merge that bumps
      # package.json produces a clean `2.3.2` rather than `2.3.2-1-g…`.
      - name: Tag the version if it is new
        id: tag
        env:
          WORKTREE_TOKEN: ${{ secrets.WORKTREE_ACCESS_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

          # Recorded as an output because the release step needs to know, and
          # the `secrets` context is not reliably available in a step `if:`.
          if [ -n "$WORKTREE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
            exit 0
          fi

          if [ -z "$WORKTREE_TOKEN" ]; then
            echo "::warning::$tag is not tagged, but WORKTREE_ACCESS_TOKEN is unset, so no tag or release was created. Staging and prod cannot deploy this version until it is."
            exit 0
          fi

          git config user.name "Worktree Actions"
          git config user.email "actions@worktree.ca"
          git tag -a "$tag" -m "Release $version"
          git push "https://oauth2:$WORKTREE_TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" "$tag"

      - name: Determine version
        id: version
        run: |
          version="$(./scripts/site_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - run: npm run build

      - name: Package the build
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="ironarachne-$VERSION.tar.gz"
          # Archived from inside build/ so the tarball holds the site at its
          # root — unpacking it anywhere gives a directory ready to publish.
          tar -czf "$artifact" -C build .
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          ls -lh "$artifact"

      # Published before the deploy so that a promotable copy exists even if the
      # dev bucket is having a bad day.
      #
      # The condition is "HEAD is exactly at the version tag" rather than "the
      # tag was created just now", which makes the step self-healing: a build
      # that cut the tag but died before publishing is repaired by the next run
      # on the same commit. The action preserves an existing release rather than
      # duplicating it, so re-running is safe. A commit past the tag has a
      # different version and is skipped.
      - name: Publish the release
        if: steps.version.outputs.version == steps.tag.outputs.package_version && steps.tag.outputs.has_token == 'true'
        uses: actions/create-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.package.outputs.artifact }}
          # These four have to be given explicitly. The action defaults them off
          # `github.event.release.*`, which does not exist on a push event, and
          # the expressions collapse to the string "true" — producing a release
          # that is a draft prerelease titled "true". A draft is invisible to
          # unauthenticated callers, so promotion could never fetch it.
          name: ${{ steps.tag.outputs.tag }}
          body: Automated release. Build artifact and its SHA-256 checksum are attached below.
          draft: false
          prerelease: false
          # Publishes a .sha256 beside the artifact, which
          # scripts/fetch_release_artifact.sh checks before unpacking. Promotion
          # is meant to move known bytes to prod; this makes "known" checkable.
          sha256sum: true
          token: ${{ secrets.WORKTREE_ACCESS_TOKEN }}

      - name: Warn when a release could not be published
        if: steps.version.outputs.version == steps.tag.outputs.package_version && steps.tag.outputs.has_token != 'true'
        run: echo "::warning::WORKTREE_ACCESS_TOKEN is unset, so ${{ steps.tag.outputs.tag }} has no release and cannot be promoted to staging or prod."

      - name: Unpack the artifact
        env:
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          # Deploying from the unpacked tarball rather than from build/ means
          # dev serves precisely what the artifact contains, so a packaging bug
          # shows up here instead of first appearing in a promotion to prod.
          rm -rf dist && mkdir -p dist
          tar -xzf "$ARTIFACT" -C dist
          echo "Unpacked $(find dist -type f | wc -l) files"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Publish to dev
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: ./scripts/publish_site.sh dev dist

      - name: Summarise
        run: echo "Deployed ${{ steps.version.outputs.version }} to https://dev.ironarachne.com"
