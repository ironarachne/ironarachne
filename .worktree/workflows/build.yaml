name: Build

# Runs on every merge to main: cuts a tag when package.json's version is new,
# produces a versioned artifact, and deploys it to dev.
#
# Build and deploy are separate jobs so the artifact is a real hand-off rather
# than an implicit side effect of the build — the same artifact staging and prod
# later promote. See docs/deployment.md and docs/versioning.md.
#
# Deliberately no `workflow_dispatch` here. Running on push is this workflow's
# entire purpose, and a manual run of it would either re-tag or rebuild a commit
# that already has an artifact — neither of which is what anyone wants from a
# button. Manual deploys live in deploy.yaml, which promotes an existing
# artifact rather than making a new one.

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/site_version.sh derives the version with `git describe`, so
          # it needs the full history and every tag. A shallow clone would find
          # no tag and quietly produce a misleading version.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Tagging happens before the version is read, so a merge that bumps
      # package.json produces a clean `2.3.0` rather than `2.3.0-1-g…`.
      - name: Tag the version if it is new
        id: tag
        env:
          WORKTREE_TOKEN: ${{ secrets.WORKTREE_ACCESS_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

          # Recorded as an output because the release step needs to know, and
          # the `secrets` context is not reliably available in a step `if:`.
          if [ -n "$WORKTREE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
            exit 0
          fi

          # Degrade rather than fail: without a token the build and the dev
          # deploy are still useful, and only promotion to staging/prod is
          # blocked. Setting the secret is a one-off; see docs/deployment.md.
          if [ -z "$WORKTREE_TOKEN" ]; then
            echo "::warning::$tag is not tagged, but WORKTREE_ACCESS_TOKEN is unset, so no tag or release was created. Staging and prod cannot deploy this version until it is."
            exit 0
          fi

          git config user.name "Worktree Actions"
          git config user.email "actions@worktree.ca"
          git tag -a "$tag" -m "Release $version"
          git push "https://oauth2:$WORKTREE_TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" "$tag"

      - name: Determine version
        id: version
        run: |
          version="$(./scripts/site_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - run: npm run build

      - name: Package the build
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="ironarachne-$VERSION.tar.gz"
          # Archived from inside build/ so the tarball holds the site at its
          # root — unpacking it anywhere gives a directory ready to publish.
          tar -czf "$artifact" -C build .
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          ls -lh "$artifact"

      # `v3-node20` is the only version that works here, and both halves of that
      # matter. v4 refuses to run anywhere but github.com, failing with
      # `GHESNotSupportedError`, because the artifact API it needs exists only
      # there; v3 speaks the older API this host does implement, but plain v3
      # ships as a node16 action and this runner rejects those outright
      # (`unsupported action type: node16`). `v3-node20` is v3's protocol on a
      # runtime the runner accepts. Both failures were hit in that order.
      - uses: https://github.com/actions/upload-artifact@v3-node20
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ steps.package.outputs.artifact }}
          retention-days: 30
          if-no-files-found: error

      # The release is the copy staging and prod promote from, so it has to
      # outlive the workflow run.
      #
      # The condition is "HEAD is exactly at the version tag" rather than "the
      # tag was created just now", which makes the step self-healing: if a build
      # cut the tag but died before attaching the artifact, the next run of this
      # workflow on the same commit finishes the job. The action preserves an
      # existing release rather than duplicating it, so re-running is safe. A
      # commit past the tag has a different version and is skipped.
      - name: Attach the artifact to its release
        if: steps.version.outputs.version == steps.tag.outputs.package_version && steps.tag.outputs.has_token == 'true'
        uses: actions/create-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.package.outputs.artifact }}
          # Publishes a .sha256 beside the artifact, which
          # scripts/fetch_release_artifact.sh checks before unpacking. Promotion
          # is meant to move known bytes to prod; this is what makes "known"
          # checkable rather than assumed.
          sha256sum: true
          token: ${{ secrets.WORKTREE_ACCESS_TOKEN }}

      - name: Warn when a release could not be published
        if: steps.version.outputs.version == steps.tag.outputs.package_version && steps.tag.outputs.has_token != 'true'
        run: echo "::warning::WORKTREE_ACCESS_TOKEN is unset, so ${{ steps.tag.outputs.tag }} has no release and cannot be promoted to staging or prod."

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Only the publish script is needed, not the history.
      - uses: actions/checkout@v4

      # `v3-node20` for the same two reasons as the upload above.
      - uses: https://github.com/actions/download-artifact@v3-node20
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Unpack the build
        env:
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          mkdir -p build
          tar -xzf "$ARTIFACT" -C build
          echo "Unpacked $(find build -type f | wc -l) files"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Publish to dev
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: ./scripts/publish_site.sh dev build

      - name: Summarise
        run: echo "Deployed ${{ needs.build.outputs.version }} to https://dev.ironarachne.com"
