name: Promote prod

# The version file is the source of truth. Manual runs re-publish the current pin.
on:
  push:
    branches: [main]
    paths:
      - deploy/prod.version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Fetch and publish the pinned release
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          REQUIRE_RELEASE_CHECKSUM: '1'
        run: |
          version="$(tr -d '[:space:]' < deploy/prod.version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::deploy/prod.version must contain a bare release version."
            exit 1
          fi

          ./scripts/fetch_release_artifact.sh "$version" build
          python3 scripts/publish_bunny_site.py prod build
          echo "Promoted $version to https://vastways.app" >> "$GITHUB_STEP_SUMMARY"
