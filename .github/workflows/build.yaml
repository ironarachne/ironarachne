name: Build

# Runs on every merge to main: cuts a tag when package.json's version is new,
# produces a versioned artifact, publishes it as a release asset, and deploys it
# to dev. See docs/deployment.md and docs/versioning.md.
#
# Serialize dev publishes separately from builds so a superseded deployment
# cannot cancel release creation. Dev still serves the unpacked build archive.
#
# Deliberately no `workflow_dispatch` here. Running on push is this workflow's
# entire purpose, and a manual run would either re-tag or rebuild a commit that
# already has an artifact. Staging and production promotion still uses commits
# to deploy/<env>.version.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.package.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/site_version.sh derives the version with `git describe`, so
          # it needs the full history and every tag. A shallow clone would find
          # no tag and quietly produce a misleading version.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tagging happens before the version is read, so a merge that bumps
      # package.json produces a clean `2.3.2` rather than `2.3.2-1-g…`.
      - name: Tag the version if it is new
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $version"
          git push origin "$tag"

      - name: Determine version
        id: version
        run: |
          version="$(./scripts/site_version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - run: npm run build

      - name: Package the build
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="ironarachne-$VERSION.tar.gz"
          # Archived from inside build/ so the tarball holds the site at its
          # root — unpacking it anywhere gives a directory ready to publish.
          tar -czf "$artifact" -C build .
          # Published beside the artifact, which scripts/fetch_release_artifact.sh
          # checks before unpacking. Promotion is meant to move known bytes to
          # prod; this makes "known" checkable.
          sha256sum "$artifact" > "$artifact.sha256"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          ls -lh "$artifact"

      # Published before the deploy so that a promotable copy exists even if the
      # dev bucket is having a bad day.
      #
      # The condition is "HEAD is exactly at the version tag" rather than "the
      # tag was created just now", which makes the step self-healing: a build
      # that cut the tag but died before publishing is repaired by the next run
      # on the same commit. An existing release is topped up rather than
      # duplicated, so re-running is safe. A commit past the tag has a different
      # version and is skipped.
      - name: Publish the release
        if: steps.version.outputs.version == steps.tag.outputs.package_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading assets."
            gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" --clobber
          else
            gh release create "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" \
              --title "$TAG" \
              --notes "Automated release. Build artifact and its SHA-256 checksum are attached below."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: ironarachne-*.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this build is current
        id: current
        run: |
          main_ref="$(git ls-remote --exit-code origin refs/heads/main)"
          main_sha="${main_ref%%$'\t'*}"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping dev publish because main has advanced.'
          fi

      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          name: dev-build

      - name: Publish to dev
        if: steps.current.outputs.publish == 'true'
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check "$ARCHIVE.sha256"
          mkdir dist
          tar -xzf "$ARCHIVE" -C dist
          python3 scripts/publish_bunny_site.py dev dist
          echo "Deployed $VERSION to https://dev.vastways.app" >> "$GITHUB_STEP_SUMMARY"
